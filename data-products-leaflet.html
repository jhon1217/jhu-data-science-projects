<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colombian City Explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font:16px system-ui;color:#17324d;background:#f5f8fa}header{padding:20px 28px;background:#124e66;color:white}header h1{margin:0 0 6px}main{padding:18px 28px}.note{max-width:900px;margin-bottom:12px}#map{height:68vh;min-height:480px;border-radius:12px;box-shadow:0 4px 18px #0002}</style></head><body><header><h1>Colombian City Explorer</h1><div>Created 2026-10-07</div></header><main><p class="note">Select a base layer and click a city marker to inspect its approximate elevation.</p><div id="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([6.3,-74.8],5.3);const street=L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);const topo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors, SRTM | OpenTopoMap'});L.control.layers({'Street':street,'Topographic':topo}).addTo(map);const cities=[['Bogotá',4.711,-74.0721,2640],['Medellín',6.2442,-75.5812,1495],['Cali',3.4516,-76.532,1018],['Barranquilla',10.9685,-74.7813,18],['Cartagena',10.391,-75.4794,2]];cities.forEach(c=>L.circleMarker([c[1],c[2]],{radius:6+c[3]/700,color:'#176B87',fillColor:'#2A9D8F',fillOpacity:.8}).bindPopup(`<strong>${c[0]}</strong><br>Elevation: ${c[3]} m`).addTo(map));</script></body></html>
