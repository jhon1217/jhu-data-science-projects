<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interactive Leaflet Map — Colombian City Explorer</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynqz6Gn1XwMg7uZxj1C0ZlBqaRWo=" crossorigin=""><style>body{margin:0;font:16px system-ui;color:#17324d;background:#f5f8fa}header{padding:20px 28px;background:#124e66;color:white}header h1{margin:0 0 6px}main{padding:18px 28px}.note{max-width:900px;margin-bottom:12px}.status{display:inline-block;margin-bottom:14px;padding:6px 10px;border-radius:999px;background:#dff5ec;color:#116149;font-weight:650}#map{height:68vh;min-height:480px;border-radius:12px;box-shadow:0 4px 18px #0002}</style></head><body><header><h1>Interactive Leaflet Map: Colombian City Explorer</h1><div>Updated 2026-10-10</div></header><main><p class="note">This interactive Leaflet map uses OpenStreetMap tiles. Zoom, pan, and click any city marker to inspect its approximate elevation.</p><div class="status">Leaflet interactive map • OpenStreetMap base layer</div><div id="map" role="application" aria-label="Interactive Leaflet map of Colombian cities"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>const map=L.map("map").setView([6.3,-74.8],5.3);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);L.control.scale().addTo(map);const cities=[["Bogotá",4.711,-74.0721,2640],["Medellín",6.2442,-75.5812,1495],["Cali",3.4516,-76.532,1018],["Barranquilla",10.9685,-74.7813,18],["Cartagena",10.391,-75.4794,2]];const markers=[];cities.forEach(c=>{const marker=L.circleMarker([c[1],c[2]],{radius:8,color:"#124e66",weight:2,fillColor:"#2A9D8F",fillOpacity:.9}).bindPopup(`<strong>${c[0]}</strong><br>Approximate elevation: ${c[3]} m`).bindTooltip(c[0]).addTo(map);markers.push(marker)});map.fitBounds(L.featureGroup(markers).getBounds().pad(.25));</script></body></html>
